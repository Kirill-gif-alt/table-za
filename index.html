<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>КРАСАВИА • Авиа-таблицы</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#011B2E;
color:white;
}

.wrapper{
display:flex;
height:100vh;
}

.sidebar{
width:320px;
background:white;
color:#012A4A;
display:flex;
flex-direction:column;
}

.logo{
padding:24px;
font-size:28px;
font-weight:700;
border-bottom:1px solid #ddd;
}

.flight-list{
flex:1;
overflow:auto;
padding:10px;
}

.flight{
padding:16px;
margin-bottom:8px;
border-radius:16px;
cursor:pointer;
display:flex;
justify-content:space-between;
}

.flight:hover{
background:#f3f4f6;
}

.active{
background:#0474BC;
color:white;
}

.main{
flex:1;
display:flex;
flex-direction:column;
}

.header{
background:#045CA4;
padding:20px 30px;
display:flex;
justify-content:space-between;
}

.content{
padding:20px;
overflow:auto;
}

.card{
background:white;
color:black;
border-radius:20px;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#012A4A;
color:white;
padding:12px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

.high{
color:#10b981;
font-weight:bold;
}

.med{
color:#f59e0b;
font-weight:bold;
}

.low{
color:#ef4444;
font-weight:bold;
}

button{
cursor:pointer;
}

</style>

</head>

<body>

<div class="wrapper">

<div class="sidebar">

<div class="logo">
✈ КРАСАВИА
</div>

<div class="flight-list" id="flightList"></div>

<div style="padding:20px">

<button
onclick="document.getElementById('fileInput').click()"
style="
width:100%;
padding:14px;
border:none;
background:#0474BC;
color:white;
border-radius:20px">

Загрузить CSV

</button>

<input
type="file"
accept=".csv"
hidden
id="fileInput">

</div>

</div>

<div class="main">

<div class="header">

<div id="title">
Загрузка...
</div>

<button
onclick="loadCSV(csvPath)"
style="
padding:10px 20px;
border:none;
background:white;
color:#045CA4;
border-radius:20px">

Обновить

</button>

</div>

<div class="content">

<div id="tableContainer"></div>

</div>

</div>

</div>

<script>

const csvPath = "./RepRaidAvailSeg_26.05.2026_17.14.50.csv";

let data=[];
let grouped={};

async function loadCSV(path){

try{

const response=
await fetch(path);

if(!response.ok)
throw new Error(
"CSV не найден"
);

const text=
await response.text();

parseCSV(text);

}
catch(err){

alert(err.message);

}

}

function parseCSV(csv){

let rows=
csv.split(/\r?\n/);

rows=
rows.slice(3);

csv=
rows.join("\n");

Papa.parse(csv,{

header:true,

skipEmptyLines:true,

complete:(res)=>{

data=
res.data;

group();

}

});

}

function group(){

grouped={};

data.forEach(r=>{

const flight=
String(
r["Рейс"]||""
)
.trim();

if(!flight)
return;

if(!grouped[flight])
grouped[flight]=[];

grouped[flight]
.push(r);

});

renderFlights();

}

function renderFlights(){

const panel=
document
.getElementById(
"flightList"
);

panel.innerHTML="";

Object
.keys(grouped)
.sort()
.forEach(f=>{

const el=
document
.createElement(
"div"
);

el.className=
"flight";

el.innerHTML=
`
<span>${f}</span>
<span>
${grouped[f].length}
</span>
`;

el.onclick=
()=>show(f);

panel
.appendChild(
el);

});

if(
Object.keys(grouped)
.length
){

show(
Object.keys(grouped)[0]
);

}

}

function show(flight){

document
.getElementById(
"title"
)
innerHTML=
"Рейс "+flight;

const rows=
grouped[flight];

let html=
`
<div class="card">

<table>

<tr>

<th>Дата</th>

<th>Сегмент</th>

<th>Маршрут</th>

<th>Total AU</th>

<th>Free</th>

<th>Загрузка</th>

</tr>
`;

rows.forEach(r=>{

const total=
Number(
r["Total AU"]||0
);

const free=
Number(
r["Free SegBkd"]||0
);

const occ=
total
?
Math.round(
(
(total-free)
/
total
)
*
100
)
:
0;

let cls="low";

if(occ>=75)
cls="high";

else if(
occ>=45
)
cls="med";

html+=`

<tr>

<td>
${r["Дата"]||"-"}
</td>

<td>
${r["Сегмент"]||"-"}
</td>

<td>
${r["Маршрут"]||"-"}
</td>

<td>
${total}
</td>

<td>
${free}
</td>

<td class="${cls}">
${occ}%
</td>

</tr>

`;

});

html+=`
</table>

</div>
`;

document
.getElementById(
"tableContainer"
)
.innerHTML=
html;

}

document
.getElementById(
"fileInput"
)
.addEventListener(
"change",
e=>{

const file=
e.target.files[0];

if(!file)
return;

Papa.parse(file,{

header:true,

skipEmptyLines:true,

beforeFirstChunk:
chunk=>{

let rows=
chunk
.split(/\r?\n/);

return rows
.slice(3)
.join("\n");

},

complete:
res=>{

data=
res.data;

group();

}

});

}

);

loadCSV(csvPath);

</script>

</body>

</html>
