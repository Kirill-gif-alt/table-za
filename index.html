<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Авиа-таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tailwind-ready">

    <div class="max-w-screen-2xl mx-auto flex flex-col h-screen">

        <!-- Вкладки -->
        <div class="bg-white border-b px-6 flex">
            <button onclick="showTab(0)" id="tab0" class="tab-button active px-8 py-4 font-medium">📊 Основная таблица</button>
            <button onclick="showTab(1)" id="tab1" class="tab-button px-8 py-4 font-medium">📅 Отчет по периоду</button>
        </div>

        <!-- Основная таблица -->
        <div id="tab-content-0" class="flex flex-1 overflow-hidden">
            <div class="hidden md:flex w-80 bg-white text-[#012A4A] border-r border-gray-200 flex-col flex-shrink-0">
                <div class="p-6 border-b flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-[#0474BC] text-white rounded-2xl flex items-center justify-center text-2xl">✈️</div>
                    <h1 class="header-font text-3xl">КРАСАВИА</h1>
                </div>
                <div class="px-6 pt-4 pb-2 text-xs uppercase tracking-widest text-gray-400 font-medium">Выберите рейс</div>
                <div id="flight-list" class="flex-1 overflow-auto px-3 py-2"></div>

                <div class="p-6 border-t space-y-4">
                    <button onclick="triggerAvailabilityUpload()" class="w-full bg-[#0474BC] hover:bg-[#045CA4] text-white py-3.5 rounded-3xl font-medium">
                        ➕ Добавить доступность
                    </button>
                    <button onclick="triggerSalesUpload()" class="w-full bg-[#8B00FF] hover:bg-[#6B00CC] text-white py-3.5 rounded-3xl font-medium">
                        ➕ Добавить продажи
                    </button>
                    <button onclick="triggerClosedUpload()" class="w-full bg-gray-600 hover:bg-gray-700 text-white py-3.5 rounded-3xl font-medium">
                        ➕ Добавить закрытые рейсы
                    </button>
                    <button onclick="saveData()" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-3xl font-medium">
                        💾 Сохранить все данные
                    </button>
                </div>
            </div>

            <div class="flex-1 flex flex-col">
                <div class="krasavia-header px-6 py-5 flex items-center justify-between">
                    <div id="selected-flight-title" class="text-2xl md:text-3xl font-semibold"></div>
                    <button onclick="refreshData()" class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-10 rounded-3xl text-sm font-medium">ОБНОВИТЬ</button>
                </div>

                <div class="flex-1 p-4 md:p-8 overflow-auto">
                    <div id="loading-screen" class="hidden flex flex-col items-center justify-center h-full">
                        <div class="w-16 h-16 border-4 border-white/30 border-t-[#04B3EC] rounded-full animate-spin"></div>
                        <p class="mt-6 text-[#04B3EC] text-xl">Загрузка данных...</p>
                    </div>
                    <div id="table-container" class="flight-card p-4 md:p-6 hidden overflow-x-auto"></div>
                </div>
            </div>
        </div>

        <!-- Отчет по периоду -->
        <div id="tab-content-1" class="flex-1 hidden flex-col overflow-hidden">
            <div class="p-6 bg-white border-b flex flex-wrap gap-4 items-center">
                <input id="reportDateFrom" type="date" class="border border-gray-300 rounded-3xl px-5 py-2">
                <span class="text-gray-500">—</span>
                <input id="reportDateTo" type="date" class="border border-gray-300 rounded-3xl px-5 py-2">
                <button onclick="showPeriodReport()" class="bg-blue-600 text-white px-8 py-2 rounded-3xl font-medium">Показать рейсы за период</button>
            </div>
            <div class="flex-1 p-6 overflow-auto">
                <div id="period-report-container" class="flight-card p-6"></div>
            </div>
        </div>
    </div>

    <input type="file" id="availabilityInput" accept=".csv" multiple class="hidden" onchange="handleAvailabilityUpload(event)">
    <input type="file" id="salesInput" accept=".csv" class="hidden" onchange="handleSalesUpload(event)">
    <input type="file" id="closedInput" accept=".csv" multiple class="hidden" onchange="handleClosedUpload(event)">

    <script src="script.js"></script>
</body>
</html>
