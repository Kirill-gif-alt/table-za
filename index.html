<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Авиа-таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&display=swap');
        :root { --primary: #0474BC; }
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        .krasavia-header { background: linear-gradient(90deg, #012A4A, #045CA4); }
        .flight-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px -10px rgb(4 116 188); }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #012A4A; color: white; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        td { color: #012A4A; font-weight: 500; }
        tr:hover { background: #f8fafc; }
        .occupancy-high { color: #22C55E; font-weight: 700; }
        .occupancy-med  { color: #F59E0B; font-weight: 700; }
        .occupancy-low  { color: #EF4444; font-weight: 700; }
        .flight-item { transition: all 0.2s; }
        .flight-item:hover { background: #f1f5f9; }
        .flight-item.active { background: #0474BC; color: white; }
        .extra-flight { color: #8B00FF; font-weight: 700; } /* фиолетовый для доп.рейсов */
    </style>
</head>
<body class="tailwind-ready bg-[#011B2E] text-white min-h-screen">

    <div class="max-w-screen-2xl mx-auto flex h-screen">
        <div class="w-72 bg-white text-[#012A4A] border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b flex items-center gap-x-3">
                <div class="w-9 h-9 bg-[#0474BC] text-white rounded-2xl flex items-center justify-center text-2xl">✈️</div>
                <h1 class="header-font text-3xl">КРАСАВИА</h1>
            </div>
            <div class="px-6 pt-4 pb-2 text-xs uppercase tracking-widest text-gray-400 font-medium">Выберите рейс</div>
            <div id="flight-list" class="flex-1 overflow-auto px-3 py-2"></div>
            <div class="p-6 border-t flex flex-col gap-2">
                <button onclick="triggerFileUpload()" class="w-full bg-[#0474BC] hover:bg-[#045CA4] text-white py-3 rounded-3xl font-medium">Загрузить доступность</button>
                <button onclick="triggerSalesUpload()" class="w-full bg-[#8B00FF] hover:bg-[#6B00CC] text-white py-3 rounded-3xl font-medium">Загрузить продажи (Tickets_SALE_Last14Days.csv)</button>
                <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="handleManualUpload(event)">
                <input type="file" id="salesInput" accept=".csv" class="hidden" onchange="handleSalesUpload(event)">
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <div class="krasavia-header px-8 py-5 flex items-center justify-between">
                <div id="selected-flight-title" class="text-3xl font-semibold"></div>
                <div class="flex items-center gap-x-8">
                    <button onclick="refreshData()" class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-10 rounded-3xl text-sm font-medium">ОБНОВИТЬ</button>
                    <div id="info-text" class="text-white/80 text-sm"></div>
                </div>
            </div>

            <div class="flex-1 p-8 overflow-auto">
                <div id="loading-screen" class="hidden flex flex-col items-center justify-center h-full">
                    <div class="w-16 h-16 border-4 border-white/30 border-t-[#04B3EC] rounded-full animate-spin"></div>
                    <p class="mt-6 text-[#04B3EC] text-xl">Загрузка данных...</p>
                </div>
                <div id="table-container" class="flight-card p-6 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const csvConfig = { path: "./RepRaidAvailSeg_26.05.2026_17.14.50.csv" };

        let allData = [];
        let salesData = [];
        let salesMap = {}; // ключ: "дата|рейс" → {today: count, yesterday: count}
        let groupedData = {};
        let currentFlight = null;

        function isExtraFlight(flight) {
            const num = parseInt(flight.replace('KV-', '')) || 0;
            if (num >= 300 && num <= 499) return true; // 3xx и 4xx — доп
            if (num >= 200 && num <= 299) {
                const exceptions = [203,204,211,212,213,214,215,216,209,210,247,248,249,250];
                return !exceptions.includes(num);
            }
            return false; // 1xx — обычные
        }

        function cleanFlight(str) {
            let f = String(str || '').trim().toUpperCase();
            f = f.replace(/[^KV0-9-]/g, '');
            return f.substring(0, 6);
        }

        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const [day, month, year] = dateStr.split('.').map(Number);
            return new Date(year, month - 1, day);
        }

        async function loadCSV(filePath) {
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('table-container').classList.add('hidden');

            const res = await fetch(filePath);
            const buffer = await res.arrayBuffer();
            const decoder = new TextDecoder('windows-1251');
            let text = decoder.decode(buffer);

            let lines = text.split('\n').slice(3);
            allData = lines.filter(line => line.trim() !== '').map(line => line.split(';').map(f => f.trim()));

            processData();
        }

        function processData() {
            groupedData = {};
            allData.forEach(row => {
                if (row.length < 7) return;
                let flight = cleanFlight(row[0]) || 'Неизвестный';
                let route = (row[3] || '').replace(/KCY/g, 'KJA'); // замена KCY → KJA
                row[3] = route; // сохраняем замену

                if (!groupedData[flight]) groupedData[flight] = [];
                groupedData[flight].push(row);
            });

            renderFlightList();
            document.getElementById('loading-screen').classList.add('hidden');

            if (Object.keys(groupedData).length > 0) {
                const first = Object.keys(groupedData).sort()[0];
                selectFlight(first);
            }
        }

        function renderFlightList() {
            const container = document.getElementById('flight-list');
            container.innerHTML = '';
            Object.keys(groupedData).sort().forEach(flight => {
                const count = groupedData[flight].length;
                const isExtra = isExtraFlight(flight);
                const div = document.createElement('div');
                div.className = `flight-item flex items-center justify-between px-6 py-4 mx-2 rounded-2xl cursor-pointer mb-1 ${currentFlight === flight ? 'active' : ''} ${isExtra ? 'extra-flight' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-x-3">
                        <span class="text-xl">✈️</span>
                        <span class="font-semibold">Рейс ${flight} ${isExtra ? '<span class="text-xs">(ДОП)</span>' : ''}</span>
                    </div>
                    <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-3xl">${count}</span>
                `;
                div.onclick = () => selectFlight(flight);
                container.appendChild(div);
            });
        }

        function selectFlight(flight) {
            currentFlight = flight;
            renderFlightList();

            let rows = groupedData[flight] || [];
            rows.sort((a, b) => parseDate(a[1]) - parseDate(b[1]));

            document.getElementById('selected-flight-title').innerHTML = `Рейс <span class="font-bold">${flight}</span>`;
            document.getElementById('info-text').innerHTML = `Записей: <span class="font-bold">${rows.length}</span>`;

            let html = `
            <table class="w-full">
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th class="text-right">(мест в продаже)</th>
                        <th class="text-right">(загрузка)</th>
                        <th class="text-right">Продано сегодня</th>
                        <th class="text-right">Продано вчера</th>
                        <th class="text-right">Загрузка</th>
                    </tr>
                </thead>
                <tbody>`;

            rows.forEach(row => {
                const date     = row[1] || '-';
                const totalAU  = parseInt(row[5] || 0);
                const freeSeg  = parseInt(row[6] || 0);
                const occupancy = totalAU > 0 ? Math.round((freeSeg / totalAU) * 100) : 0;

                const key = `${date}|${cleanFlight(row[0])}`;
                const salesToday = salesMap[key] ? salesMap[key].today || 0 : 0;
                const salesYesterday = salesMap[key] ? salesMap[key].yesterday || 0 : 0;

                const occClass = occupancy >= 75 ? 'occupancy-high' : 
                               (occupancy >= 45 ? 'occupancy-med' : 'occupancy-low');

                html += `
                    <tr>
                        <td>${date}</td>
                        <td class="text-right font-semibold">${totalAU || '-'}</td>
                        <td class="text-right font-semibold">${freeSeg || '-'}</td>
                        <td class="text-right font-semibold">${salesToday}</td>
                        <td class="text-right font-semibold">${salesYesterday}</td>
                        <td class="text-right font-bold ${occClass}">${occupancy}%</td>
                    </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('table-container').innerHTML = html;
            document.getElementById('table-container').classList.remove('hidden');
        }

        function refreshData() { loadCSV(csvConfig.path); }

        function triggerFileUpload() { document.getElementById('fileInput').click(); }
        function handleManualUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                let text = ev.target.result;
                let lines = text.split('\n').slice(3);
                allData = lines.filter(line => line.trim() !== '').map(line => line.split(';').map(f => f.trim()));
                processData();
            };
            reader.readAsText(file, 'windows-1251');
        }

        function triggerSalesUpload() { document.getElementById('salesInput').click(); }
        function handleSalesUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                let text = ev.target.result;
                let lines = text.split('\n').filter(l => l.trim() !== '');
                salesData = lines.map(line => line.split(',').map(f => f.trim()));

                // Строим карту продаж (сегодня = последняя дата в файле, вчера = предпоследняя)
                salesMap = {};
                const todayStr = salesData[1] ? salesData[1][0] : ''; // FileDate
                const yesterdayStr = salesData[2] ? salesData[2][0] : '';

                salesData.forEach(row => {
                    if (row.length < 10) return;
                    const flyDate = row[7] || ''; // FLYDATE (индекс может немного варьироваться)
                    const reis = cleanFlight(row[12] || ''); // REIS (примерный индекс)
                    if (!flyDate || !reis) return;

                    const key = `${flyDate}|${reis}`;
                    if (!salesMap[key]) salesMap[key] = {today: 0, yesterday: 0};

                    if (flyDate === todayStr) salesMap[key].today++;
                    else if (flyDate === yesterdayStr) salesMap[key].yesterday++;
                });

                console.log('%c=== КАРТА ПРОДАЖ ГОТОВА ===', 'color: lime; font-size: 16px');
                console.log('Пример ключа:', Object.keys(salesMap)[0]);
                alert('Продажи успешно загружены! Столбцы "Продано сегодня / вчера" теперь работают.');
                if (currentFlight) selectFlight(currentFlight);
            };
            reader.readAsText(file, 'windows-1251');
        }

        window.onload = () => loadCSV(csvConfig.path);
    </script>
</body>
</html>
