<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Авиа-таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500&amp;display=swap');
        
        :root { --primary: #0474BC; }
        
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }

        .krasavia-header {
            background: linear-gradient(90deg, #012A4A, #045CA4);
        }
        
        .flight-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px -10px rgb(4 116 188);
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13.5px;
        }
        
        th, td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        th {
            background: #012A4A;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        tr:hover {
            background: #f8fafc;
        }
        
        .occupancy-high { color: #10b981; }
        .occupancy-med { color: #f59e0b; }
        .occupancy-low { color: #ef4444; }
    </style>
</head>
<body class="tailwind-ready bg-[#011B2E] text-white min-h-screen">

    <!-- ====================== ИНСТРУКЦИЯ ====================== -->
    <!-- 
        КРАСАВИА • CSV АВИА-ПРОСМОТРЩИК (СУПЕР-БЫСТРЫЙ)
        ================================================
        
        КАК ИСПОЛЬЗОВАТЬ:
        1. Положи свой CSV-файл рядом с index.html (или в папку data/)
        2. Внизу в конфиге (csvConfig) укажи точное имя файла
        3. Запусти через Live Server / python -m http.server / GitHub Pages
        4. Таблицы автоматически группируются по колонке "Рейс"
        5. Показываются только важные колонки: Дата, Total AU, Free SegBkd + % загрузки
        
        Работает мгновенно даже на очень больших CSV.
    -->

    <div class="max-w-screen-2xl mx-auto">
        <!-- HEADER -->
        <div class="krasavia-header flex items-center justify-between px-8 py-5 sticky top-0 z-50 shadow-2xl">
            <div class="flex items-center gap-x-4">
                <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-[#045CA4] text-3xl">✈️</div>
                <h1 class="header-font text-4xl tracking-[-2px]">КРАСАВИА</h1>
                <span class="text-xs font-mono bg-white/20 px-4 py-1 rounded-3xl">CSV • АВИА</span>
            </div>
            
            <div class="flex items-center gap-x-6">
                <button onclick="refreshData()" 
                        class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-11 rounded-3xl text-sm font-medium">
                    ОБНОВИТЬ ДАННЫЕ
                </button>
                <button onclick="triggerFileUpload()" 
                        class="flex items-center gap-x-2 bg-white text-[#045CA4] hover:bg-amber-300 px-6 h-11 rounded-3xl font-semibold text-sm">
                    ЗАГРУЗИТЬ ДРУГОЙ CSV
                </button>
                <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="handleManualUpload(event)">
            </div>
        </div>

        <div class="p-8">
            <!-- Info -->
            <div id="info-bar" class="flex justify-between items-center mb-8 bg-[#012A4A] rounded-3xl px-8 py-5">
                <div>
                    <span id="file-name-display" class="font-mono text-[#04B3EC]"></span>
                </div>
                <div id="total-flights" class="text-white/70"></div>
            </div>

            <!-- Loading -->
            <div id="loading-screen" class="hidden flex flex-col items-center py-20">
                <div class="w-16 h-16 border-4 border-white/30 border-t-[#04B3EC] rounded-full animate-spin"></div>
                <p class="mt-6 text-[#04B3EC] text-xl">Парсим CSV...</p>
            </div>

            <!-- Главный контейнер с таблицами по рейсам -->
            <div id="tables-container" class="space-y-10"></div>
        </div>
    </div>

    <script>
        // ====================== КОНФИГУРАЦИЯ ======================
        const csvConfig = {
            path: "./RepRaidAvailSeg_26.05.2026_17.14.50.csv",   // ← ИЗМЕНИ НА ИМЯ ТВОЕГО ФАЙЛА
            displayName: "RepRaidAvailSeg"
        };

        let allData = [];
        let groupedData = {};

        // Основная функция загрузки и обработки CSV
        async function loadCSV(filePath) {
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('tables-container').innerHTML = '';

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('CSV файл не найден');

                const csvText = await response.text();

                // Парсим CSV через PapaParse (очень быстро и надёжно)
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        allData = results.data;
                        processData();
                    }
                });
            } catch (err) {
                alert('Ошибка загрузки CSV:\n' + err.message);
                document.getElementById('loading-screen').classList.add('hidden');
            }
        }

        function processData() {
            groupedData = {};

            allData.forEach(row => {
                const flight = row['Рейс'] || row['рейс'] || 'Неизвестный рейс';
                if (!groupedData[flight]) {
                    groupedData[flight] = [];
                }
                groupedData[flight].push(row);
            });

            renderAllTables();
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('file-name-display').innerHTML = 
                `<span class="font-semibold">${csvConfig.displayName}</span> — ${Object.keys(groupedData).length} рейсов`;
            document.getElementById('total-flights').innerHTML = 
                `Найдено рейсов: <span class="font-bold text-[#04B3EC]">${Object.keys(groupedData).length}</span>`;
        }

        function renderAllTables() {
            const container = document.getElementById('tables-container');
            container.innerHTML = '';

            Object.keys(groupedData).sort().forEach(flight => {
                const rows = groupedData[flight];

                let html = `
                <div class="flight-card p-6">
                    <div class="flex justify-between items-center mb-5 border-b pb-4">
                        <div class="flex items-center gap-x-4">
                            <span class="text-3xl">✈️</span>
                            <div>
                                <h2 class="text-2xl font-semibold text-[#012A4A]">Рейс ${flight}</h2>
                                <p class="text-[#045CA4] text-sm">${rows.length} записей</p>
                            </div>
                        </div>
                    </div>
                    
                    <table>
                        <thead>
                            <tr>
                                <th>Дата</th>
                                <th>Сегмент</th>
                                <th>Маршрут</th>
                                <th class="text-right">Total AU<br><span class="text-xs opacity-75">(всего мест)</span></th>
                                <th class="text-right">Free SegBkd<br><span class="text-xs opacity-75">(свободно)</span></th>
                                <th class="text-right">Загрузка</th>
                            </tr>
                        </thead>
                        <tbody>`;

                rows.forEach(row => {
                    const totalAU = parseInt(row['Total AU'] || row['Total AU '] || 0);
                    const freeSeg = parseInt(row['Free SegBkd'] || row['Free SegBkd '] || 0);
                    const occupancy = totalAU > 0 ? Math.round((totalAU - freeSeg) / totalAU * 100) : 0;
                    
                    let occClass = occupancy > 75 ? 'occupancy-high' : (occupancy > 45 ? 'occupancy-med' : 'occupancy-low');

                    html += `
                        <tr>
                            <td class="font-medium">${row['Дата'] || '-'}</td>
                            <td>${row['Сегмент'] || '-'}</td>
                            <td>${row['Маршрут'] || '-'}</td>
                            <td class="text-right font-semibold">${totalAU}</td>
                            <td class="text-right font-semibold">${freeSeg}</td>
                            <td class="text-right font-bold ${occClass}">${occupancy}%</td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                container.innerHTML += html;
            });
        }

        function refreshData() {
            loadCSV(csvConfig.path);
        }

        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        function handleManualUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    allData = results.data;
                    csvConfig.displayName = file.name;
                    processData();
                }
            });
        }

        // Инициализация
        async function initKrasAviaCSVViewer() {
            await loadCSV(csvConfig.path);
            console.log('%c✈️ КРАСАВИА CSV Viewer запущен — данные по рейсам готовы', 'color:#04B3EC; font-size:15px; font-weight:700');
        }

        window.onload = initKrasAviaCSVViewer;
    </script>
</body>
</html>
