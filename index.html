<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="tailwind-ready bg-gray-50">

    <div class="flex h-screen overflow-hidden">

        <!-- ЛЕВАЯ ПАНЕЛЬ -->
        <div class="w-72 bg-white border-r border-gray-200 flex flex-col shadow-xl">
            <div class="p-5 border-b flex items-center gap-x-3 bg-gradient-to-r from-[#012A4A] to-[#011F38] text-white">
                <div class="w-9 h-9 bg-white text-[#012A4A] rounded-3xl flex items-center justify-center text-3xl font-bold">К</div>
                <h1 class="header-font text-3xl tracking-tighter">К</h1>
            </div>
            
            <div class="px-6 pt-5 pb-3 text-xs uppercase tracking-widest text-gray-500 font-semibold">Выберите рейс</div>
            <div id="flight-list" class="flex-1 overflow-auto px-3 py-2 space-y-1"></div>

            <div class="p-6 space-y-3 border-t">
                <button onclick="triggerAvailabilityUpload()" class="w-full bg-[#012A4A] hover:bg-[#011F38] text-white py-4 rounded-3xl font-medium flex items-center justify-center gap-2 shadow-lg">✈️ Добавить доступность</button>
                <button onclick="triggerSalesUpload()" class="w-full bg-[#8B00FF] hover:bg-[#6B00CC] text-white py-4 rounded-3xl font-medium flex items-center justify-center gap-2 shadow-lg">💰 Добавить продажи</button>
                <button onclick="triggerClosedUpload()" class="w-full bg-gray-700 hover:bg-gray-800 text-white py-4 rounded-3xl font-medium flex items-center justify-center gap-2 shadow-lg">🔒 Добавить закрытые рейсы</button>
                <button onclick="saveData()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-3xl font-medium flex items-center justify-center gap-2 shadow-lg">💾 Сохранить данные</button>
            </div>
        </div>

        <!-- ПРАВАЯ ЧАСТЬ — ТАБЛИЦА -->
        <div class="flex-1 flex flex-col overflow-hidden">

            <!-- Маленький заголовок рейса -->
            <div class="bg-[#012A4A] px-8 py-3 flex items-center text-white">
                <div id="selected-flight-title" class="text-xl font-semibold"></div>
            </div>

            <!-- СКРОЛЛ КОНТЕЙНЕР ДЛЯ ТАБЛИЦЫ -->
            <div class="flex-1 overflow-auto p-4 bg-gray-50">
                <div id="table-container" class="flight-card"></div>
            </div>
        </div>
    </div>

    <input type="file" id="availabilityInput" accept=".csv" multiple class="hidden" onchange="handleAvailabilityUpload(event)">
    <input type="file" id="salesInput" accept=".csv" class="hidden" onchange="handleSalesUpload(event)">
    <input type="file" id="closedInput" accept=".csv" multiple class="hidden" onchange="handleClosedUpload(event)">

    <script src="script.js"></script>
</body>
</html>
