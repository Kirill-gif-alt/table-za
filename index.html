<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Авиа-таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&display=swap');
        :root { --primary: #0474BC; }
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        .krasavia-header { background: linear-gradient(90deg, #012A4A, #045CA4); }
        .flight-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px -10px rgb(4 116 188); }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        th { background: #012A4A; color: white; font-weight: 600; position: sticky; top: 0; z-index: 10; }
        td { color: #012A4A; font-weight: 500; }
        tr:hover { background: #f8fafc; }
        .occupancy-high { color: #22C55E; font-weight: 700; }
        .occupancy-med  { color: #F59E0B; font-weight: 700; }
        .occupancy-low  { color: #EF4444; font-weight: 700; }
        tr.extra-flight { background: #f3e8ff !important; } /* фиолетовый фон */
        .extra-badge { color: #8B00FF; font-weight: 700; }
        .flight-item { transition: all 0.2s; }
        .flight-item:hover { background: #f1f5f9; }
        .flight-item.active { background: #0474BC; color: white; }
        .path-box { background: #f1f5f9; border: 3px dashed #0474BC; }
    </style>
</head>
<body class="tailwind-ready bg-[#011B2E] text-white min-h-screen">

    <div class="max-w-screen-2xl mx-auto flex flex-col md:flex-row h-screen">
        <div class="w-full md:w-80 bg-white text-[#012A4A] border-r border-gray-200 flex flex-col flex-shrink-0">
            <div class="p-6 border-b flex items-center gap-x-3">
                <div class="w-9 h-9 bg-[#0474BC] text-white rounded-2xl flex items-center justify-center text-2xl">✈️</div>
                <h1 class="header-font text-3xl">КРАСАВИА</h1>
            </div>
            <div class="px-6 pt-4 pb-2 text-xs uppercase tracking-widest text-gray-400 font-medium">Выберите рейс</div>
            <div id="flight-list" class="flex-1 overflow-auto px-3 py-2"></div>

            <div class="p-6 border-t space-y-6">
                <div class="path-box p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 mb-1">Доступность — 2 последних файла</p>
                    <p class="text-[#0474BC] font-medium text-sm">Y:\Отделы\11 КС\ООРП\Загрузка\База оп</p>
                    <button onclick="triggerAvailabilityUpload()" class="mt-4 w-full bg-[#0474BC] hover:bg-[#045CA4] text-white py-3.5 rounded-3xl font-medium">
                        ➕ Выбрать папку с доступностью
                    </button>
                </div>

                <div class="path-box p-5 rounded-3xl">
                    <p class="text-xs text-gray-500 mb-1">Продажи</p>
                    <p class="text-[#8B00FF] font-medium text-sm">Y:\Отделы\11 КС\ООРП\Загрузка\csv</p>
                    <button onclick="triggerSalesUpload()" class="mt-4 w-full bg-[#8B00FF] hover:bg-[#6B00CC] text-white py-3.5 rounded-3xl font-medium">
                        ➕ Выбрать файл продаж
                    </button>
                </div>

                <input type="file" id="availabilityInput" accept=".csv" multiple webkitdirectory directory class="hidden" onchange="handleAvailabilityUpload(event)">
                <input type="file" id="salesInput" accept=".csv" class="hidden" onchange="handleSalesUpload(event)">
            </div>
        </div>

        <div class="flex-1 flex flex-col">
            <div class="krasavia-header px-6 md:px-8 py-5 flex items-center justify-between">
                <div id="selected-flight-title" class="text-2xl md:text-3xl font-semibold"></div>
                <button onclick="refreshData()" class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-10 rounded-3xl text-sm font-medium">ОБНОВИТЬ</button>
            </div>

            <div class="flex-1 p-4 md:p-8 overflow-auto">
                <div id="loading-screen" class="hidden flex flex-col items-center justify-center h-full">
                    <div class="w-16 h-16 border-4 border-white/30 border-t-[#04B3EC] rounded-full animate-spin"></div>
                    <p class="mt-6 text-[#04B3EC] text-xl">Загрузка данных...</p>
                </div>
                <div id="table-container" class="flight-card p-6 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let salesMap = {};
        let groupedData = {};
        let currentFlight = null;

        function normalizeDate(d) {
            d = String(d || '').trim();
            if (d.includes('.')) return d;
            if (d.length === 8) return `${d.slice(0,2)}.${d.slice(2,4)}.${d.slice(4)}`;
            return d;
        }

        function cleanFlight(str) {
            let f = String(str || '').trim().toUpperCase();
            f = f.replace(/[^KV0-9-]/g, '');
            return f.substring(0, 6);
        }

        function getBaseFlight(flight) {
            let num = parseInt(flight.replace('KV-', '')) || 0;
            if (num >= 300 && num <= 499) return `KV-${num - 200}`;
            return flight;
        }

        function isExtraFlight(flight) {
            let num = parseInt(flight.replace('KV-', '')) || 0;
            const exceptions = [203,204,211,212,213,214,215,216,209,210,247,248,249,250,225,226];
            if (num >= 200 && num <= 299) return !exceptions.includes(num);
            if (num >= 300 && num <= 499) return true;
            return false;
        }

        function parseDate(dateStr) {
            if (!dateStr) return new Date(0);
            const [day, month, year] = dateStr.split('.').map(Number);
            return new Date(year, month - 1, day);
        }

        function processData() {
            groupedData = {};
            allData.forEach(row => {
                if (row.length < 7) return;
                let flight = cleanFlight(row[0]);
                let baseFlight = getBaseFlight(flight);
                let route = (row[3] || '').replace(/KCY/g, 'KJA');
                row[3] = route;
                if (!groupedData[baseFlight]) groupedData[baseFlight] = [];
                groupedData[baseFlight].push(row);
            });

            renderFlightList();
            if (Object.keys(groupedData).length > 0) selectFlight(Object.keys(groupedData).sort()[0]);
        }

        function renderFlightList() {
            const container = document.getElementById('flight-list');
            container.innerHTML = '';
            Object.keys(groupedData).sort().forEach(baseFlight => {
                const count = groupedData[baseFlight].length;
                const div = document.createElement('div');
                div.className = `flight-item flex items-center justify-between px-6 py-4 mx-2 rounded-2xl cursor-pointer mb-1 ${currentFlight === baseFlight ? 'active' : ''}`;
                const route = groupedData[baseFlight][0][3] || baseFlight;
                div.innerHTML = `
                    <div class="flex items-center gap-x-3">
                        <span class="text-xl">✈️</span>
                        <span class="font-semibold">${route}</span>
                    </div>
                    <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-3xl">${count}</span>
                `;
                div.onclick = () => selectFlight(baseFlight);
                container.appendChild(div);
            });
        }

        function selectFlight(baseFlight) {
            currentFlight = baseFlight;
            renderFlightList();

            let rows = groupedData[baseFlight] || [];
            rows.sort((a, b) => parseDate(a[1]) - parseDate(b[1]));

            document.getElementById('selected-flight-title').innerHTML = `Рейс <span class="font-bold">${baseFlight}</span>`;

            let html = `<table class="w-full"><thead><tr>
                <th>Дата</th>
                <th class="text-right">(мест в продаже)</th>
                <th class="text-right">(загрузка)</th>
                <th class="text-right">Продано сегодня</th>
                <th class="text-right">Продано вчера</th>
                <th class="text-right">Загрузка</th>
            </tr></thead><tbody>`;

            rows.forEach(row => {
                const date = row[1] || '-';
                const totalAU = parseInt(row[5] || 0);
                const freeSeg = parseInt(row[6] || 0);
                const occupancy = totalAU > 0 ? Math.round((freeSeg / totalAU) * 100) : 0;
                const key = `${date}|${cleanFlight(row[0])}`;
                const sales = salesMap[key] || {today:0, yesterday:0};
                const isExtra = isExtraFlight(cleanFlight(row[0]));
                const rowClass = isExtra ? 'extra-flight' : '';
                const occClass = occupancy >= 75 ? 'occupancy-high' : (occupancy >= 45 ? 'occupancy-med' : 'occupancy-low');

                html += `<tr class="${rowClass}">
                    <td>${date} ${isExtra ? '<span class="extra-badge ml-2">(ДОП)</span>' : ''}</td>
                    <td class="text-right font-semibold">${totalAU}</td>
                    <td class="text-right font-semibold">${freeSeg}</td>
                    <td class="text-right font-semibold">${sales.today}</td>
                    <td class="text-right font-semibold">${sales.yesterday}</td>
                    <td class="text-right font-bold ${occClass}">${occupancy}%</td>
                </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('table-container').innerHTML = html;
            document.getElementById('table-container').classList.remove('hidden');
        }

        function triggerAvailabilityUpload() {
            alert("✅ ОТКРОЙТЕ ПАПКУ:\n\nY:\\Отделы\\11 КС\\ООРП\\Загрузка\\База оп\n\nВыберите всю папку (не отдельные файлы)");
            document.getElementById('availabilityInput').click();
        }

        function handleAvailabilityUpload(e) {
            const files = Array.from(e.target.files).filter(f => f.name.endsWith('.csv'));
            if (files.length === 0) return alert("В папке нет CSV-файлов");

            // Сортируем по имени (самые новые обычно имеют большую дату в названии)
            files.sort((a, b) => b.name.localeCompare(a.name));
            const latestTwo = files.slice(0, 2);

            let loaded = 0;
            allData = [];

            latestTwo.forEach(file => {
                const reader = new FileReader();
                reader.onload = ev => {
                    let lines = ev.target.result.split('\n').slice(3);
                    const parsed = lines.filter(l => l.trim()).map(l => l.split(';').map(f => f.trim()));
                    allData = allData.concat(parsed);
                    loaded++;
                    if (loaded === latestTwo.length) {
                        processData();
                        alert(`✅ Загружено 2 самых новых файла из папки`);
                    }
                };
                reader.readAsText(file, 'windows-1251');
            });
        }

        function triggerSalesUpload() {
            alert("✅ ОТКРОЙТЕ ПАПКУ:\n\nY:\\Отделы\\11 КС\\ООРП\\Загрузка\\csv\n\nВыберите файл Tickets_SALE_Last14Days.csv");
            document.getElementById('salesInput').click();
        }

        function handleSalesUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = ev => {
                let lines = ev.target.result.split('\n').filter(l => l.trim());
                const rows = lines.map(l => l.split(',').map(f => f.trim()));
                salesMap = {};
                rows.forEach(row => {
                    if (row.length < 13) return;
                    const date = normalizeDate(row[7] || '');
                    const flight = cleanFlight(row[12] || '');
                    if (!date || !flight) return;
                    const key = `${date}|${flight}`;
                    if (!salesMap[key]) salesMap[key] = {today:0, yesterday:0};
                    const todayStr = normalizeDate(rows[1] ? rows[1][0] : '');
                    if (date === todayStr) salesMap[key].today++;
                    else if (rows[2] && date === normalizeDate(rows[2][0])) salesMap[key].yesterday++;
                });
                alert('✅ Продажи загружены!');
                if (currentFlight) selectFlight(currentFlight);
            };
            reader.readAsText(file, 'windows-1251');
        }

        function refreshData() { location.reload(); }

        window.onload = () => console.log('%cКРАСАВИА — всё готово', 'color:#0474BC;font-weight:bold');
    </script>
</body>
</html>
