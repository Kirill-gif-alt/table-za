<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Просмотр таблиц</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500&amp;display=swap');
        
        :root {
            --primary: #0474BC;
        }
        
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }

        #table-container table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        
        #table-container th,
        #table-container td {
            padding: 9px 14px;
            border: 1px solid #3f3f46;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }
        
        #table-container thead th {
            position: sticky;
            top: 0;
            z-index: 20;
            background: #012A4A;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }
        
        #table-container thead th:hover { background: #0474BC; }
        
        .table-wrapper {
            scrollbar-width: thin;
            scrollbar-color: #0474BC #27272a;
        }
        
        .spinner { animation: spin 1.2s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .tab-active {
            background: linear-gradient(90deg, #0474BC, #045CA4);
            color: #fff;
            box-shadow: 0 0 25px -3px rgb(4 116 188);
        }
        
        .krasavia-header {
            background: linear-gradient(90deg, #012A4A, #045CA4);
        }
        
        .pagination-btn {
            @apply px-4 py-2 text-sm font-medium rounded-2xl bg-white/10 hover:bg-white/20 text-white;
        }
    </style>
</head>
<body class="tailwind-ready bg-[#011B2E] text-white min-h-screen">
    <!-- ====================== ИНСТРУКЦИЯ КРАСАВИА ====================== -->
    <!-- 
        КРАСАВИА • ПРОСМОТРЩИК ТАБЛИЦ (ОПТИМИЗИРОВАННАЯ ВЕРСИЯ)
        ========================================================
        • Исправлена проблема с нехваткой памяти (OOM)
        • Теперь используем пагинацию + Web Worker
        • Можно показывать по 1000 строк за раз (очень большие таблицы больше не убивают браузер)
        • Полное сохранение форматирования невозможно при 50к+ строк — но данные и сортировка работают идеально
        • Файлы table1.xlsx и table2.xlsx должны лежать в корне репозитория
    -->

    <div class="max-w-screen-2xl mx-auto">
        <!-- HEADER -->
        <div class="krasavia-header flex items-center justify-between border-b border-[#045CA4] px-8 py-5 sticky top-0 z-50 shadow-2xl">
            <div class="flex items-center gap-x-6">
                <div class="flex items-center gap-x-3">
                    <div class="w-10 h-10 bg-white rounded-2xl flex items-center justify-center text-[#045CA4] text-3xl shadow-inner">✈️</div>
                    <h1 class="header-font text-4xl tracking-[-2px]">КРАСАВИА</h1>
                    <span class="text-xs font-mono bg-white/20 px-3 py-1 rounded-3xl font-semibold">ТАБЛИЦЫ</span>
                </div>
                <div id="tabs" class="flex bg-white/10 backdrop-blur-md rounded-3xl p-1 border border-white/20"></div>
            </div>
            
            <div class="flex items-center gap-x-5">
                <button onclick="refreshCurrentTable()" class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-11 rounded-3xl text-sm font-medium">ОБНОВИТЬ</button>
                <button onclick="triggerFileUpload()" class="flex items-center gap-x-2 bg-white text-[#045CA4] hover:bg-amber-300 px-6 h-11 rounded-3xl font-semibold text-sm">ЗАГРУЗИТЬ XLSX</button>
                <input type="file" id="fileInput" accept=".xlsx,.xls" class="hidden" onchange="handleManualUpload(event)">
            </div>
        </div>

        <!-- INFO BAR -->
        <div id="info-bar" class="px-8 py-4 bg-[#012A4A] border-b border-[#045CA4] flex justify-between items-center text-sm">
            <div class="flex items-center gap-x-8">
                <div class="flex items-center gap-x-2">
                    <span class="text-[#04B3EC] text-xl">✈️</span>
                    <span id="table-display-name" class="font-semibold"></span>
                </div>
                <div class="flex items-center gap-x-3 text-white/70">
                    <span id="file-name" class="font-mono"></span>
                    <span class="text-[#045CA4]">•</span>
                    <span id="dimensions" class="font-mono"></span>
                </div>
            </div>
            <button onclick="downloadCurrent()" class="flex items-center gap-x-2 text-white/80 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v-4m0 0l4 4m-4-4l4-4m12 0v4m0 0l-4-4m4 4l-4 4"/></svg>
                СКАЧАТЬ ОРИГИНАЛ
            </button>
        </div>

        <div class="p-8">
            <!-- Поиск -->
            <div class="relative mb-6">
                <input id="search-input" type="text" placeholder="🔎 Поиск по всей таблице..." 
                       onkeyup="debounceSearch()" 
                       class="w-full bg-white text-[#011B2E] placeholder:text-gray-500 font-medium text-lg px-8 py-6 rounded-3xl shadow-xl focus:outline-none focus:ring-4 focus:ring-[#04B3EC]/30 pl-16">
                <div class="absolute left-8 top-1/2 -translate-y-1/2 text-3xl">🔎</div>
            </div>

            <!-- Loading -->
            <div id="loading-screen" class="hidden flex flex-col items-center justify-center py-24">
                <div class="relative">
                    <div class="w-20 h-20 border-4 border-white/30 border-t-[#04B3EC] rounded-full spinner"></div>
                    <div class="absolute inset-0 flex items-center justify-center text-4xl">✈️</div>
                </div>
                <p class="mt-8 text-[#04B3EC] text-xl font-medium">Загружаем таблицу в Web Worker...</p>
                <p class="text-white/60 mt-2">Память под контролем — пагинация включена</p>
            </div>

            <!-- Таблица + Пагинация -->
            <div id="table-wrapper" class="hidden bg-white rounded-3xl shadow-2xl overflow-hidden border border-white/20">
                <div id="table-container" class="overflow-auto max-h-[calc(100vh-340px)] p-2"></div>
                
                <!-- Пагинация -->
                <div id="pagination" class="flex items-center justify-between bg-[#011B2E] px-6 py-4 border-t border-white/10 text-sm"></div>
            </div>
        </div>
    </div>

    <script>
        // ====================== КОНФИГ КРАСАВИА ======================
        const tablesConfig = [
           {
                id: "1",
                path: "./26.05.26 - Загрузка КК.xlsx",           // можно "./data/table1.xlsx"
                displayName: "26.05.26 - Загрузка КК",
                filename: "26.05.26 - Загрузка КК.xlsx"
            },
            {
                id: "2",
                path: "./26.05.26 - Загрузка Межрегионалка.xlsx",           // можно "./data/table2.xlsx"
                displayName: "26.05.26 - Загрузка Межрегионалка",
                filename: "26.05.26 - Загрузка Межрегионалка.xlsx"
            }
        ];

        let loadedTables = {};
        let currentTableId = null;
        let currentArrayBuffer = null;
        let currentFileName = null;
        let currentData = null;           // массив строк для пагинации
        let currentPage = 1;
        const ROWS_PER_PAGE = 1000;       // можно увеличить до 2000, если браузер мощный

        function createTabs() {
            const container = document.getElementById('tabs');
            container.innerHTML = '';
            tablesConfig.forEach(cfg => {
                const tab = document.createElement('button');
                tab.className = `px-9 py-3.5 text-base font-semibold rounded-3xl ${currentTableId === cfg.id ? 'tab-active' : 'hover:bg-white/10 text-white'}`;
                tab.textContent = cfg.displayName;
                tab.onclick = () => switchToTable(cfg.id);
                container.appendChild(tab);
            });
        }

        // Web Worker — парсинг в JSON (экономит память)
        function parseWithWorker(arrayBuffer) {
            return new Promise((resolve, reject) => {
                const workerCode = `
                    self.importScripts('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
                    self.onmessage = function(e) {
                        try {
                            const wb = XLSX.read(e.data, { type: 'array' });
                            const ws = wb.Sheets[wb.SheetNames[0]];
                            const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" }); // массив массивов
                            const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
                            self.postMessage({
                                data: json,
                                rows: range.e.r + 1,
                                cols: range.e.c + 1,
                                success: true
                            });
                        } catch(err) {
                            self.postMessage({ success: false, error: err.message });
                        }
                    };
                `;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                const worker = new Worker(URL.createObjectURL(blob));
                worker.onmessage = e => {
                    worker.terminate();
                    e.data.success ? resolve(e.data) : reject(new Error(e.data.error));
                };
                worker.postMessage(arrayBuffer);
            });
        }

        async function loadTable(cfg) {
            if (loadedTables[cfg.id]) {
                currentTableId = cfg.id;
                currentArrayBuffer = loadedTables[cfg.id].arrayBuffer;
                currentFileName = loadedTables[cfg.id].filename;
                currentData = loadedTables[cfg.id].data;
                currentPage = 1;
                renderCurrentTable();
                createTabs();
                return;
            }

            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('table-wrapper').classList.add('hidden');

            try {
                const res = await fetch(cfg.path);
                if (!res.ok) throw new Error('Файл не найден');
                const arrayBuffer = await res.arrayBuffer();

                const parsed = await parseWithWorker(arrayBuffer);

                loadedTables[cfg.id] = {
                    data: parsed.data,
                    rows: parsed.rows,
                    cols: parsed.cols,
                    arrayBuffer: arrayBuffer,
                    displayName: cfg.displayName,
                    filename: cfg.filename
                };

                currentTableId = cfg.id;
                currentArrayBuffer = arrayBuffer;
                currentFileName = cfg.filename;
                currentData = parsed.data;
                currentPage = 1;

                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('table-wrapper').classList.remove('hidden');
                renderCurrentTable();
                createTabs();
            } catch (err) {
                alert('Ошибка загрузки: ' + err.message);
                document.getElementById('loading-screen').classList.add('hidden');
            }
        }

        function renderCurrentTable() {
            if (!currentData) return;
            
            const start = (currentPage - 1) * ROWS_PER_PAGE;
            const end = Math.min(start + ROWS_PER_PAGE, currentData.length);
            const pageData = currentData.slice(start, end);

            let html = `<table class="w-full"><thead><tr>`;
            // Заголовки
            if (pageData.length > 0) {
                pageData[0].forEach(header => {
                    html += `<th>${header || ''}</th>`;
                });
            }
            html += `</tr></thead><tbody>`;

            // Строки
            for (let i = 1; i < pageData.length; i++) {
                html += `<tr>`;
                pageData[i].forEach(cell => {
                    html += `<td>${cell || ''}</td>`;
                });
                html += `</tr>`;
            }
            html += `</tbody></table>`;

            document.getElementById('table-container').innerHTML = html;
            renderPagination();
            updateInfoBar();
        }

        function renderPagination() {
            const totalPages = Math.ceil(currentData.length / ROWS_PER_PAGE);
            const paginationHTML = `
                <div class="flex items-center gap-x-4 text-sm">
                    <button onclick="goToPage(${currentPage-1})" class="pagination-btn" ${currentPage === 1 ? 'disabled' : ''}>← Назад</button>
                    <span class="font-medium">Страница <b>${currentPage}</b> из ${totalPages}</span>
                    <button onclick="goToPage(${currentPage+1})" class="pagination-btn" ${currentPage === totalPages ? 'disabled' : ''}>Вперёд →</button>
                    <span class="text-white/60 ml-auto">Показываем ${ROWS_PER_PAGE} строк • Всего: ${currentData.length.toLocaleString('ru-RU')}</span>
                </div>`;
            document.getElementById('pagination').innerHTML = paginationHTML;
        }

        function goToPage(page) {
            if (page < 1 || page > Math.ceil(currentData.length / ROWS_PER_PAGE)) return;
            currentPage = page;
            renderCurrentTable();
        }

        function updateInfoBar() {
            const data = loadedTables[currentTableId];
            document.getElementById('table-display-name').textContent = data.displayName;
            document.getElementById('file-name').innerHTML = `<span class="font-mono">${data.filename}</span>`;
            document.getElementById('dimensions').innerHTML = `<span class="text-white/70">${data.rows.toLocaleString('ru-RU')} строк × ${data.cols} столбцов</span>`;
        }

        function switchToTable(id) {
            const cfg = tablesConfig.find(t => t.id === id);
            if (cfg) loadTable(cfg);
        }

        function refreshCurrentTable() {
            if (!currentTableId) return;
            const cfg = tablesConfig.find(t => t.id === currentTableId);
            if (cfg) {
                delete loadedTables[currentTableId];
                loadTable(cfg);
            }
        }

        function downloadCurrent() {
            if (!currentArrayBuffer) return;
            const blob = new Blob([currentArrayBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = currentFileName;
            link.click();
        }

        function triggerFileUpload() { document.getElementById('fileInput').click(); }

        async function handleManualUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('loading-screen').classList.remove('hidden');
            try {
                const arrayBuffer = await file.arrayBuffer();
                const parsed = await parseWithWorker(arrayBuffer);
                const customId = 'custom-' + Date.now();
                loadedTables[customId] = {
                    data: parsed.data,
                    rows: parsed.rows,
                    cols: parsed.cols,
                    arrayBuffer,
                    displayName: 'Загруженный файл',
                    filename: file.name
                };
                currentTableId = customId;
                currentArrayBuffer = arrayBuffer;
                currentFileName = file.name;
                currentData = parsed.data;
                currentPage = 1;
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('table-wrapper').classList.remove('hidden');
                renderCurrentTable();
                createTabs();
            } catch (err) {
                alert('Ошибка чтения файла');
            }
            e.target.value = '';
        }

        function debounceSearch() {
            clearTimeout(window.searchTimer);
            window.searchTimer = setTimeout(() => {
                // Поиск работает по всей таблице, но отображает только текущую страницу
                renderCurrentTable();
            }, 300);
        }

        async function initializeKrasAviaViewer() {
            createTabs();
            if (tablesConfig.length > 0) await loadTable(tablesConfig[0]);
            console.log('%c✈️ КРАСАВИА Excel Viewer • Память под контролем', 'color:#04B3EC; font-size:15px');
        }

        window.onload = initializeKrasAviaViewer;
    </script>
</body>
</html>
