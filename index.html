<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КРАСАВИА • Авиа-таблицы</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500&amp;display=swap');
        
        :root { --primary: #0474BC; }
        
        * { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 150ms; }
        
        .tailwind-ready { font-family: 'Inter', system_ui, sans-serif; }
        .header-font { font-family: 'Space Grotesk', sans-serif; }
        
        .krasavia-header {
            background: linear-gradient(90deg, #012A4A, #045CA4);
        }
        
        .flight-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px -10px rgb(4 116 188);
        }
        
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 14px;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        
        th {
            background: #012A4A;
            color: white;
            font-weight: 600;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        tr:hover {
            background: #f1f5f9;
        }
        
        .occupancy-high { color: #10b981; font-weight: 700; }
        .occupancy-med  { color: #f59e0b; font-weight: 700; }
        .occupancy-low  { color: #ef4444; font-weight: 700; }
        
        .flight-item {
            transition: all 0.2s;
        }
        .flight-item:hover {
            background: #f1f5f9;
        }
        .flight-item.active {
            background: #0474BC;
            color: white;
        }
    </style>
</head>
<body class="tailwind-ready bg-[#011B2E] text-white min-h-screen">

    <!-- ====================== ИНСТРУКЦИЯ ====================== -->
    <!-- 
        КРАСАВИА • ПРОСМОТРЩИК CSV (ФИНАЛЬНАЯ ВЕРСИЯ)
        ================================================
        • Выбор рейса из боковой панели
        • Показывается только выбранный рейс
        • Современный дизайн в стиле КрасАвиа
        • Мгновенная загрузка CSV
    -->

    <div class="max-w-screen-2xl mx-auto flex h-screen">
        <!-- Сайдбар с выбором рейсов -->
        <div class="w-72 bg-white text-[#012A4A] border-r border-gray-200 flex flex-col">
            <div class="p-6 border-b">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-[#0474BC] text-white rounded-2xl flex items-center justify-center text-2xl">✈️</div>
                    <h1 class="header-font text-3xl">КРАСАВИА</h1>
                </div>
                <p class="text-xs font-mono text-gray-500 mt-1">Авиа-таблицы</p>
            </div>
            
            <div class="p-4 text-xs uppercase tracking-widest text-gray-400 font-medium px-6">Выберите рейс</div>
            
            <div id="flight-list" class="flex-1 overflow-auto px-3 py-2"></div>
            
            <div class="p-6 border-t text-xs text-gray-400">
                <button onclick="triggerFileUpload()" 
                        class="w-full flex items-center justify-center gap-x-2 bg-[#0474BC] text-white py-3 rounded-3xl hover:bg-[#045CA4]">
                    <span>Загрузить другой CSV</span>
                </button>
                <input type="file" id="fileInput" accept=".csv" class="hidden" onchange="handleManualUpload(event)">
            </div>
        </div>

        <!-- Основная область -->
        <div class="flex-1 flex flex-col">
            <!-- Top bar -->
            <div class="krasavia-header px-8 py-5 flex items-center justify-between">
                <div class="flex items-center gap-x-4">
                    <span id="selected-flight-title" class="text-2xl font-semibold"></span>
                </div>
                
                <div class="flex items-center gap-x-6">
                    <button onclick="refreshData()" 
                            class="flex items-center gap-x-2 bg-white/10 hover:bg-white/20 px-6 h-10 rounded-3xl text-sm font-medium">
                        ОБНОВИТЬ
                    </button>
                    <div id="info-text" class="text-white/80 text-sm font-medium"></div>
                </div>
            </div>

            <!-- Контент -->
            <div class="flex-1 p-8 overflow-auto">
                <div id="loading-screen" class="hidden flex flex-col items-center justify-center h-full">
                    <div class="w-16 h-16 border-4 border-white/30 border-t-[#04B3EC] rounded-full animate-spin"></div>
                    <p class="mt-6 text-[#04B3EC] text-xl">Загрузка данных...</p>
                </div>

                <div id="no-selection" class="hidden flex flex-col items-center justify-center h-full text-center">
                    <div class="text-7xl mb-6">✈️</div>
                    <p class="text-2xl text-white/70">Выберите рейс в боковой панели</p>
                </div>

                <div id="table-container" class="flight-card p-6 hidden"></div>
            </div>
        </div>
    </div>

    <script>
        const csvConfig = {
            path: "./RepRaidAvailSeg_26.05.2026_17.14.50.csv",
            displayName: "RepRaidAvailSeg"
        };

        let allData = [];
        let groupedData = {};
        let currentFlight = null;

        function normalize(str) {
            return String(str || '').trim().toLowerCase();
        }

        function findValue(row, keys) {
            for (let key in row) {
                const nKey = normalize(key);
                for (let k of keys) {
                    if (nKey.includes(normalize(k))) {
                        return row[key];
                    }
                }
            }
            return '';
        }

        async function loadCSV(filePath) {
            document.getElementById('loading-screen').classList.remove('hidden');
            document.getElementById('table-container').classList.add('hidden');
            document.getElementById('no-selection').classList.add('hidden');

            try {
                const res = await fetch(filePath);
                if (!res.ok) throw new Error('CSV не найден');
                const csvText = await res.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        allData = results.data;
                        processData();
                    }
                });
            } catch (err) {
                alert('Ошибка загрузки CSV: ' + err.message);
                document.getElementById('loading-screen').classList.add('hidden');
            }
        }

        function processData() {
            groupedData = {};

            allData.forEach(row => {
                const flight = findValue(row, ['Рейс', 'рейс', 'Flight', 'KV-']) || 'Неизвестный рейс';
                if (!groupedData[flight]) groupedData[flight] = [];
                groupedData[flight].push(row);
            });

            renderFlightList();
            document.getElementById('loading-screen').classList.add('hidden');
            
            // Автоматически выбираем первый рейс
            if (Object.keys(groupedData).length > 0) {
                const firstFlight = Object.keys(groupedData).sort()[0];
                selectFlight(firstFlight);
            }
        }

        function renderFlightList() {
            const container = document.getElementById('flight-list');
            container.innerHTML = '';

            Object.keys(groupedData).sort().forEach(flight => {
                const count = groupedData[flight].length;
                const div = document.createElement('div');
                div.className = `flight-item flex items-center justify-between px-6 py-4 mx-2 rounded-2xl cursor-pointer mb-1 ${currentFlight === flight ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="flex items-center gap-x-3">
                        <span class="text-xl">✈️</span>
                        <div>
                            <div class="font-semibold">Рейс ${flight}</div>
                            <div class="text-xs text-gray-500">${count} записей</div>
                        </div>
                    </div>
                `;
                div.onclick = () => selectFlight(flight);
                container.appendChild(div);
            });
        }

        function selectFlight(flight) {
            currentFlight = flight;
            renderFlightList();
            
            const rows = groupedData[flight] || [];
            
            document.getElementById('no-selection').classList.add('hidden');
            document.getElementById('table-container').classList.remove('hidden');
            document.getElementById('selected-flight-title').innerHTML = `Рейс <span class="text-3xl">${flight}</span>`;
            
            let html = `
            <table>
                <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Сегмент</th>
                        <th>Маршрут</th>
                        <th class="text-right">Total AU</th>
                        <th class="text-right">Free SegBkd</th>
                        <th class="text-right">Загрузка</th>
                    </tr>
                </thead>
                <tbody>`;

            rows.forEach(row => {
                const date = findValue(row, ['Дата', 'date']) || '-';
                const segment = findValue(row, ['Сегмент', 'segment']) || '-';
                const route = findValue(row, ['Маршрут', 'route']) || '-';
                const totalAU = parseInt(findValue(row, ['Total AU', 'TotalAU', 'total au']) || 0);
                const freeSeg = parseInt(findValue(row, ['Free SegBkd', 'FreeSegBkd', 'free seg']) || 0);
                const occupancy = totalAU > 0 ? Math.round(((totalAU - freeSeg) / totalAU) * 100) : 0;

                const occClass = occupancy >= 75 ? 'occupancy-high' : (occupancy >= 45 ? 'occupancy-med' : 'occupancy-low');

                html += `
                    <tr>
                        <td class="font-medium">${date}</td>
                        <td>${segment}</td>
                        <td>${route}</td>
                        <td class="text-right font-semibold">${totalAU}</td>
                        <td class="text-right font-semibold">${freeSeg}</td>
                        <td class="text-right font-bold ${occClass}">${occupancy}%</td>
                    </tr>`;
            });

            html += `</tbody></table>`;
            document.getElementById('table-container').innerHTML = html;
            
            document.getElementById('info-text').innerHTML = `Записей: <span class="font-bold">${rows.length}</span>`;
        }

        function refreshData() {
            loadCSV(csvConfig.path);
        }

        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        function handleManualUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: (results) => {
                    allData = results.data;
                    csvConfig.displayName = file.name;
                    processData();
                }
            });
        }

        window.onload = () => loadCSV(csvConfig.path);
    </script>
</body>
</html>
